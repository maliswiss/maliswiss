name: Update Featured Projects

# Aktualisiert den "Featured Projects"-Bereich im Profil-README automatisch.
on:
  # Bei jedem Push auf den Standardbranch
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'          # Endlosschleife vermeiden (eigene Commits ignorieren)
  # Taeglich um 06:00 UTC
  schedule:
    - cron: '0 6 * * *'
  # Manuell ausloesbar ueber den Actions-Tab
  workflow_dispatch:

permissions:
  contents: write            # noetig, um README zurueck zu committen

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhaengigkeiten installieren
        run: pip install requests

      - name: Featured Projects aktualisieren
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_REPOS: '8'
        run: python update_projects.py

      - name: Aenderungen committen und pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet README.md; then
            echo "Keine Aenderungen am README."
          else
            git add README.md
            git commit -m "chore: update featured projects [skip ci]"
            git push
          fi
