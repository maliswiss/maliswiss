name: Update Featured Projects

# Diese Workflow aktualisiert den "Featured Projects"-Bereich im Profil-README automatisch.
# Sie wird täglich ausgeführt und kann auch manuell gestartet werden.

on:
  schedule:
    # Jeden Tag um 06:00 UTC (08:00 Bern-Zeit im Sommer)
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/update_projects.py'
      - '.github/workflows/update-projects.yml'

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: pip install requests

      - name: Projekte-Sektion aktualisieren
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: maliswiss
        run: python scripts/update_projects.py

      - name: Änderungen committen und pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet README.md; then
            echo "Keine Änderungen am README — kein Commit nötig."
          else
            git add README.md
            git commit -m "chore: Featured Projects automatisch aktualisiert"
            git push
          fi
